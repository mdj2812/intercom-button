[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; ── Flash & PSRAM ───────────────────────────────────
board_build.flash_mode = dio
board_build.psram_type = opi
board_upload.flash_size = 8MB

; ── LittleFS for runtime config ─────────────────────
board_build.partitions = partitions_ota_8MB.csv
board_build.filesystem = littlefs

; ── USB ─────────────────────────────────────────────
; Do not hardcode ttyACM0 — the CDC device is often ttyACM1 after a
; reconnect. Docker/dev.sh exports PLATFORMIO_*_PORT for the mounted node.
upload_protocol = esptool

; ── Static analysis ─────────────────────────────────
check_tool = cppcheck

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0
    bblanchon/ArduinoJson @ ^6.21.0

# ── Native test environment (no ESP32 needed) ────────
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++20
    -O0
    -g
    --coverage
    -Itest/mocks
    -DARDUINOJSON_ENABLE_ARDUINO_STRING
    -DUNIT_TEST
build_unflags = -Os
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.0
build_src_filter =
    +<*>
    -<main.cpp>          ; compiled into test_firmware_main via #include (Arduino setup/loop)
test_build_src = yes
extra_scripts = extra_script.py
